<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>本地字幕设置</title><style>body{font:16px system-ui;background:#11151e;color:#eef2fa;max-width:640px;margin:80px auto;line-height:1.8}button{background:#a7c7ff;border:0;padding:12px 24px;border-radius:8px;cursor:pointer}a{color:#a7c7ff}</style></head><body><h1>YouTube 本地字幕</h1><p id="status">检查连接…</p><p>先启动项目中的 Start.cmd，再打开本机设置页连接扩展。</p><button id="setup">打开本机设置页</button><p>返回 YouTube，在播放器右上角点击“本地字幕”。备用快捷键：Alt + Shift + L，可在 <code>chrome://extensions/shortcuts</code> 修改。</p><script src="options.js"></script></body></html>
